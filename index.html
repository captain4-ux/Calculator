<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NOVA Scientific Calculator</title>
<meta name="theme-color" content="#090d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NOVA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: #090d16; touch-action: manipulation; overscroll-behavior: none; }
body {
  min-height: 100vh; min-height: 100dvh;
  display: flex; justify-content: center; align-items: center;
  color: #fff; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Arial, sans-serif;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.calculator { width: 100%; max-width: 410px; padding: 20px; background: #141b29; border: 1px solid #29364c; border-radius: 25px; box-shadow: 0 20px 60px #0008; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.logo { font-size: 21px; font-weight: bold; letter-spacing: 2px; }
.subtitle { font-size: 11px; color: #8998ad; margin-top: 5px; }
button { min-width: 0; height: clamp(46px, 6.6vh, 58px); border: none; border-radius: 13px; background: #253147; color: #fff; font-size: 18px; cursor: pointer; transition: .15s; font-family: inherit; }
button:active { transform: scale(.95); filter: brightness(1.3); }
.icon-btn { height: auto; background: #25334a; padding: 10px 14px; border-radius: 10px; font-size: 18px; }
.display { background: #0d1421; border-radius: 17px; padding: 14px 15px 16px; min-height: 135px; display: flex; flex-direction: column; justify-content: space-between; text-align: right; margin-bottom: 14px; overflow: hidden; }
.mode { align-self: flex-start; height: auto; padding: 4px 10px; border-radius: 999px; background: #162235; color: #72b7ff; font-size: 11px; letter-spacing: 1px; }
.expression { color: #9baac0; font-size: 19px; overflow-wrap: anywhere; min-height: 25px; }
.result { font-size: clamp(27px, 8vw, 38px); font-weight: bold; overflow-wrap: anywhere; min-height: 45px; }
.scientific { display: none; }
.calculator.sci-open .scientific { display: grid; }
.mode { display: none; }
.calculator.sci-open .mode { display: block; }
.head-btns { display: flex; gap: 8px; }
.icon-btn.on { background: #30445e; color: #8bc5ff; }
.scientific, .buttons { grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 10px; }
.buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 10px; }
.buttons { margin-bottom: 0; }
.scientific button { height: clamp(36px, 5.2vh, 43px); font-size: 14px; background: #1d2c42; color: #83bdff; }
.operator { background: #30445e; color: #8bc5ff; }
.danger { background: #8d3541; }
.equal { background: #248e72; grid-column: span 4; font-size: 22px; font-weight: bold; }
.history { background: #0d1421; border-radius: 12px; padding: 12px; margin-bottom: 14px; max-height: 170px; overflow-y: auto; display: none; }
.history.open { display: block; }
.hist-top { display: flex; justify-content: space-between; align-items: center; color: #8998ad; font-size: 12px; letter-spacing: 1px; margin-bottom: 4px; }
.hist-top button { height: auto; padding: 4px 10px; font-size: 12px; background: #25334a; border-radius: 8px; }
.history-item { width: 100%; text-align: left; height: auto; background: none; border-radius: 0; padding: 9px 4px; border-bottom: 1px solid #29364c; color: #b7c6da; font-size: 13px; }
.history-item strong { display: block; color: #fff; margin-top: 5px; font-size: 16px; overflow-wrap: anywhere; }
.hist-empty { color: #61718a; font-size: 13px; padding: 10px 4px; }
@media (max-width: 350px) { .calculator { padding: 14px; } }
</style>
</head>
<body>
<main class="calculator" id="calc">
  <div class="header">
    <div>
      <div class="logo">NOVA</div>
      <div class="subtitle" id="subtitle">CALCULATOR</div>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="sciBtn" type="button" aria-label="Scientific functions" aria-pressed="false">f(x)</button>
      <button class="icon-btn" id="histBtn" type="button" aria-label="History">◷</button>
    </div>
  </div>

  <div class="display">
    <button class="mode" id="mode" type="button" aria-label="Switch degrees and radians">DEG</button>
    <div class="expression" id="expression">0</div>
    <div class="result" id="result" aria-live="polite">0</div>
  </div>

  <div class="history" id="history">
    <div class="hist-top"><span>HISTORY</span><button id="histClear" type="button">Clear</button></div>
    <div id="historyList"></div>
  </div>

  <div class="scientific" id="sci">
    <button data-v="sin(">sin</button>
    <button data-v="cos(">cos</button>
    <button data-v="tan(">tan</button>
    <button data-v="sqrt(">√</button>

    <button data-v="log(">log</button>
    <button data-v="ln(">ln</button>
    <button data-v="pi">π</button>
    <button data-v="e">e</button>

    <button data-v="^2">x²</button>
    <button data-v="^">xʸ</button>
    <button data-v="!">n!</button>
    <button data-v="abs(">|x|</button>
  </div>

  <div class="buttons" id="keys">
    <button class="danger" data-a="ac">AC</button>
    <button class="operator" data-v="(">(</button>
    <button class="operator" data-v=")">)</button>
    <button class="operator" data-a="back" aria-label="Delete">⌫</button>

    <button data-v="7">7</button>
    <button data-v="8">8</button>
    <button data-v="9">9</button>
    <button class="operator" data-v="/">÷</button>

    <button data-v="4">4</button>
    <button data-v="5">5</button>
    <button data-v="6">6</button>
    <button class="operator" data-v="*">×</button>

    <button data-v="1">1</button>
    <button data-v="2">2</button>
    <button data-v="3">3</button>
    <button class="operator" data-v="-">−</button>

    <button data-v="0">0</button>
    <button data-v=".">.</button>
    <button data-v="%">%</button>
    <button class="operator" data-v="+">+</button>

    <button class="equal" data-a="eq">=</button>
  </div>
</main>

<script>
(function () {
var expression = "";
var angleMode = "DEG";
var justEvaluated = false;
var calcHistory = [];
var OPS = "+-*/^";
var FUNCS = ["sin", "cos", "tan", "sqrt", "log", "ln", "abs"];
var KEY = "nova-calcHistory-v1", MAX = 50;

var exprEl = document.getElementById("expression");
var resEl = document.getElementById("result");
var modeEl = document.getElementById("mode");
var histEl = document.getElementById("calcHistory");
var listEl = document.getElementById("historyList");

try { calcHistory = JSON.parse(localStorage.getItem(KEY) || "[]"); if (!Array.isArray(calcHistory)) calcHistory = []; } catch (e) { calcHistory = []; }
function saveHistory() { try { localStorage.setItem(KEY, JSON.stringify(calcHistory)); } catch (e) {} }

function pretty(s) {
  return s.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−").replace(/pi/g, "π").replace(/sqrt\(/g, "√(");
}
function fmt(n) {
  if (n === 0) return "0";
  var a = Math.abs(n);
  if (a >= 1e12 || a < 1e-6) return n.toExponential(6).replace(/\.?0+e/, "e");
  return String(n);
}
// A result that JS prints with "e" gets re-entered as a bracketed power of ten
function asInput(n) {
  var s = String(n), m = /^(-?[\d.]+)e([+-]\d+)$/.exec(s);
  return m ? "(" + m[1] + "*10^(" + m[2] + "))" : s;
}

// Safe parser: + - * / ^ ! %, brackets, functions, implicit multiplication (2π, 3(4+1))
function evaluate(input) {
  var tokens = input.match(/\d+\.?\d*|\.\d+|[a-zA-Z]+|[()+\-*\/^%!]/g) || [];
  if (tokens.join("") !== input) throw new Error("syntax");
  var pos = 0;
  function peek() { return tokens[pos]; }
  function take() { return tokens[pos++]; }
  function startsOperand(t) { return t !== undefined && /^(\d|\.|[a-zA-Z]|\()/.test(t); }

  function expr() {
    var x = term();
    while (peek() === "+" || peek() === "-") {
      var o = take(), y = term();
      x = o === "+" ? x + y : x - y;
    }
    return x;
  }
  function term() {
    var x = unary();
    for (;;) {
      var t = peek();
      if (t === "*" || t === "/") {
        take();
        var y = unary();
        if (t === "/") { if (y === 0) throw new Error("DIV0"); x /= y; } else x *= y;
      } else if (startsOperand(t)) {
        x *= unary();
      } else break;
    }
    return x;
  }
  function unary() {
    if (peek() === "-") { take(); return -unary(); }
    if (peek() === "+") { take(); return unary(); }
    return power();
  }
  function power() {
    var b = postfix();
    if (peek() === "^") { take(); return Math.pow(b, unary()); }
    return b;
  }
  function postfix() {
    var x = primary();
    while (peek() === "!" || peek() === "%") {
      if (take() === "!") {
        if (x < 0 || x > 170 || Math.floor(x) !== x) throw new Error("factorial");
        var f = 1;
        for (var n = 2; n <= x; n++) f *= n;
        x = f;
      } else x /= 100;
    }
    return x;
  }
  function primary() {
    var v = take();
    if (v === undefined) throw new Error("syntax");
    if (v === "(") {
      var x = expr();
      if (take() !== ")") throw new Error("syntax");
      return x;
    }
    if (/^(\d|\.)/.test(v)) return Number(v);
    if (v === "pi") return Math.PI;
    if (v === "e") return Math.E;
    if (FUNCS.indexOf(v) > -1) {
      if (take() !== "(") throw new Error("syntax");
      var a = expr();
      if (take() !== ")") throw new Error("syntax");
      return fn(v, a);
    }
    throw new Error("syntax");
  }
  function fn(name, a) {
    var r = angleMode === "DEG" ? a * Math.PI / 180 : a;
    if (name === "sin") return Math.sin(r);
    if (name === "cos") return Math.cos(r);
    if (name === "tan") { if (Math.abs(Math.cos(r)) < 1e-12) throw new Error("tan"); return Math.tan(r); }
    if (name === "sqrt") { if (a < 0) throw new Error("sqrt"); return Math.sqrt(a); }
    if (name === "log") { if (a <= 0) throw new Error("log"); return Math.log10(a); }
    if (name === "ln") { if (a <= 0) throw new Error("ln"); return Math.log(a); }
    return Math.abs(a);
  }

  var ans = expr();
  if (pos !== tokens.length || !isFinite(ans)) throw new Error("math");
  if (Math.abs(ans) < 1e-12) ans = 0;
  return Number(ans.toPrecision(12));
}

// drop a trailing operator and close any open brackets
function closeBrackets(src) {
  while (src && OPS.indexOf(src.slice(-1)) > -1) src = src.slice(0, -1);
  var open = (src.match(/\(/g) || []).length - (src.match(/\)/g) || []).length;
  while (open-- > 0) src += ")";
  return src;
}

function add(v) {
  var isOp = v.length === 1 && OPS.indexOf(v) > -1;
  var startsNew = /^[0-9.]/.test(v) || /^(sin|cos|tan|sqrt|log|ln|abs|pi|e|\()/.test(v);
  if (justEvaluated) { if (startsNew) expression = ""; justEvaluated = false; }
  if (expression.length >= 100) return;

  if (v === ".") {
    var seg = /[0-9.]*$/.exec(expression)[0];
    if (seg.indexOf(".") > -1) return;
    if (seg === "") v = "0.";
  }
  if (v === "!" || v === "%" || v === "^2") {
    if (!expression || /[+\-*\/^(]$/.test(expression)) return;
  }
  if (v === ")") {
    var open = (expression.match(/\(/g) || []).length - (expression.match(/\)/g) || []).length;
    if (open <= 0 || /\($/.test(expression)) return;
  }
  if (isOp) {
    if (expression === "") { if (v !== "-") return; }
    else {
      var last = expression.slice(-1);
      if (OPS.indexOf(last) > -1 && !(v === "-" && "*/^".indexOf(last) > -1)) {
        while (expression && OPS.indexOf(expression.slice(-1)) > -1) expression = expression.slice(0, -1);
        if (expression === "" && v !== "-") { update(); return; }
      }
    }
  }
  expression += v;
  update();
}

function update() {
  exprEl.textContent = expression ? pretty(expression) : "0";
  if (!expression) { resEl.textContent = "0"; return; }
  try { resEl.textContent = fmt(evaluate(closeBrackets(expression))); }
  catch (e) { resEl.textContent = "…"; }
}
function clearAll() { expression = ""; justEvaluated = false; update(); }
function backspace() {
  if (justEvaluated) { clearAll(); return; }
  var m = /(sin\(|cos\(|tan\(|sqrt\(|log\(|ln\(|abs\(|pi)$/.exec(expression);
  expression = expression.slice(0, m ? -m[0].length : -1);
  update();
}
function calculate() {
  if (!expression) return;
  var src = closeBrackets(expression);
  try {
    var ans = evaluate(src);
    calcHistory.unshift({ expression: src, answer: fmt(ans) });
    if (calcHistory.length > MAX) calcHistory.length = MAX;
    saveHistory(); renderHistory();
    expression = asInput(ans);
    justEvaluated = true;
    exprEl.textContent = pretty(src) + " =";
    resEl.textContent = fmt(ans);
  } catch (e) {
    resEl.textContent = e.message === "DIV0" ? "Can’t divide by zero" : "Error";
  }
}
function toggleAngle() {
  angleMode = angleMode === "DEG" ? "RAD" : "DEG";
  modeEl.textContent = angleMode;
  update();
}

function renderHistory() {
  listEl.innerHTML = "";
  if (!calcHistory.length) {
    var d = document.createElement("div");
    d.className = "hist-empty"; d.textContent = "No calculations yet.";
    listEl.appendChild(d); return;
  }
  calcHistory.forEach(function (item) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "calcHistory-item";
    var e = document.createElement("span"); e.textContent = pretty(item.expression) + " =";
    var a = document.createElement("strong"); a.textContent = item.answer;
    b.appendChild(e); b.appendChild(a);
    b.addEventListener("click", function () {
      var n = Number(item.answer);
      expression = isNaN(n) ? item.answer : asInput(n);
      justEvaluated = true;
      exprEl.textContent = pretty(item.expression) + " =";
      resEl.textContent = item.answer;
      histEl.classList.remove("open");
    });
    listEl.appendChild(b);
  });
}

function onKeys(e) {
  var b = e.target.closest("button");
  if (!b) return;
  var a = b.getAttribute("data-a"), v = b.getAttribute("data-v");
  if (a === "ac") clearAll();
  else if (a === "back") backspace();
  else if (a === "eq") calculate();
  else if (v) add(v);
}
document.getElementById("keys").addEventListener("click", onKeys);
document.getElementById("sci").addEventListener("click", onKeys);
modeEl.addEventListener("click", toggleAngle);
document.getElementById("histBtn").addEventListener("click", function () { histEl.classList.toggle("open"); });
document.getElementById("histClear").addEventListener("click", function () { calcHistory = []; saveHistory(); renderHistory(); });

document.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  if (/^[0-9.+\-*\/()%^!]$/.test(k)) add(k);
  else if (k === ",") add(".");
  else if (k === "Enter" || k === "=") { e.preventDefault(); calculate(); }
  else if (k === "Backspace") backspace();
  else if (k === "Escape" || k === "Delete") clearAll();
});

document.getElementById("sciBtn").addEventListener("click", function () {
  var calc = document.getElementById("calc");
  var on = !calc.classList.contains("sci-open");
  calc.classList.toggle("sci-open", on);
  this.classList.toggle("on", on);
  this.setAttribute("aria-pressed", on ? "true" : "false");
  document.getElementById("subtitle").textContent = on ? "SCIENTIFIC CALCULATOR" : "CALCULATOR";
});

renderHistory();
update();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
})();
</script>
</body>
</html>
